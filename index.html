<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Index — apps-privacy</title>
    <meta
      name="description"
      content="Index of HTML pages in the nourddinak/apps-privacy repository"
    />
    <style>
      :root {
        --bg: #f4f7fb;
        --bg-strong: #eaf1ff;
        --panel: rgba(255, 255, 255, 0.8);
        --panel-strong: #ffffff;
        --text: #10213a;
        --muted: #5a6981;
        --border: rgba(143, 161, 196, 0.28);
        --accent: #3867ff;
        --accent-2: #6c63ff;
        --accent-soft: rgba(56, 103, 255, 0.12);
        --success: #0f9f6e;
        --shadow: 0 18px 50px rgba(31, 52, 88, 0.12);
      }

      html[data-theme="dark"] {
        --bg: #0a1120;
        --bg-strong: #101b2b;
        --panel: rgba(12, 20, 33, 0.82);
        --panel-strong: #111d2d;
        --text: #edf4ff;
        --muted: #a0b2cf;
        --border: rgba(150, 172, 214, 0.2);
        --accent: #7aa5ff;
        --accent-2: #9e8bff;
        --accent-soft: rgba(122, 165, 255, 0.12);
        --success: #59d3a1;
        --shadow: 0 22px 50px rgba(2, 6, 18, 0.5);
      }

      * { box-sizing: border-box; }

      html { scroll-behavior: smooth; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(108, 99, 255, 0.12), transparent 30%),
          radial-gradient(circle at top right, rgba(56, 103, 255, 0.14), transparent 38%),
          var(--bg);
        color: var(--text);
        transition: background 0.25s ease, color 0.25s ease;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      .page-shell {
        max-width: 1100px;
        margin: 0 auto;
        padding: 32px 20px 56px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 20px;
        border: 1px solid var(--border);
        background: var(--panel);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-radius: 20px;
        box-shadow: var(--shadow);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 14px;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 800;
        letter-spacing: 0.04em;
        box-shadow: 0 12px 26px rgba(90, 110, 255, 0.34);
      }

      .brand-copy {
        line-height: 1.2;
      }

      .eyebrow {
        margin: 0;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .brand-copy h1 {
        margin: 4px 0 0;
        font-size: clamp(1.2rem, 2vw, 1.7rem);
        letter-spacing: -0.04em;
      }

      .theme-toggle {
        border: 1px solid var(--border);
        background: var(--panel-strong);
        color: var(--text);
        border-radius: 999px;
        padding: 10px 16px;
        font-size: 0.93rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s ease, border-color 0.2s ease;
      }

      .theme-toggle:hover {
        transform: translateY(-1px);
        border-color: rgba(56, 103, 255, 0.3);
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(220px, 0.8fr);
        gap: 18px;
        margin-top: 28px;
      }

      .hero-card,
      .stats-card,
      .toolbar,
      .list-item {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 22px;
        box-shadow: var(--shadow);
      }

      .hero-card {
        padding: 28px;
      }

      .hero-card h2 {
        margin: 10px 0 12px;
        font-size: clamp(2rem, 3vw, 3rem);
        line-height: 1.02;
        letter-spacing: -0.06em;
      }

      .lead {
        margin: 0;
        color: var(--muted);
        font-size: 1.02rem;
        line-height: 1.7;
        max-width: 60ch;
      }

      .stats-card {
        padding: 20px;
        display: grid;
        gap: 16px;
        align-content: center;
      }

      .stat {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 14px 16px;
        border-radius: 16px;
        background: var(--accent-soft);
        border: 1px solid rgba(56, 103, 255, 0.18);
      }

      .stat strong {
        font-size: clamp(1.5rem, 2vw, 2.1rem);
        letter-spacing: -0.06em;
      }

      .stat span {
        color: var(--muted);
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .toolbar {
        margin-top: 26px;
        padding: 14px 16px;
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
      }

      .search {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--panel-strong);
        border: 1px solid var(--border);
        padding: 12px 14px;
        border-radius: 14px;
      }

      .search svg {
        width: 18px;
        height: 18px;
        color: var(--muted);
        flex-shrink: 0;
      }

      .search input {
        border: none;
        background: transparent;
        outline: none;
        color: var(--text);
        width: 100%;
        font: inherit;
      }

      .search input::placeholder {
        color: var(--muted);
      }

      .toolbar button {
        border: none;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #ffffff;
        padding: 12px 18px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 0.96rem;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 10px 24px rgba(79, 104, 255, 0.3);
      }

      .toolbar button:hover {
        transform: translateY(-1px);
      }

      .list {
        list-style: none;
        margin: 22px 0 0;
        padding: 0;
        display: grid;
        gap: 14px;
      }

      .list-item {
        padding: 18px 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .item-main {
        min-width: 0;
      }

      .file-tag {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 999px;
        border: 1px solid rgba(95, 133, 255, 0.2);
        background: var(--accent-soft);
        color: var(--accent);
        padding: 6px 10px;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .file-name {
        display: block;
        margin-top: 10px;
        font-size: clamp(1.1rem, 2vw, 1.4rem);
        font-weight: 700;
        letter-spacing: -0.04em;
        color: var(--text);
      }

      .meta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.84rem;
      }

      .meta-row a {
        color: var(--accent);
        font-weight: 600;
      }

      .size-pill {
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 8px 12px;
        color: var(--muted);
        background: var(--panel-strong);
        font-size: 0.8rem;
        font-weight: 700;
        white-space: nowrap;
      }

      .empty-state,
      .loading-state {
        padding: 24px 18px;
        text-align: center;
        color: var(--muted);
        border: 1px dashed var(--border);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.12);
      }

      @media (max-width: 760px) {
        .topbar,
        .toolbar,
        .list-item {
          flex-direction: column;
          align-items: stretch;
        }

        .hero {
          grid-template-columns: 1fr;
        }

        .toolbar {
          padding: 12px;
        }

        .list-item {
          padding: 16px;
        }

        .size-pill {
          align-self: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">A</div>
          <div class="brand-copy">
            <p class="eyebrow">Repository</p>
            <h1>apps-privacy</h1>
          </div>
        </div>
        <button id="toggle-theme" class="theme-toggle" type="button">Dark mode</button>
      </header>

      <main>
        <section class="hero">
          <div class="hero-card">
            <p class="eyebrow">HTML index</p>
            <h2>Browse the privacy pages in this repo</h2>
            <p class="lead">
              This index lists the HTML files available at the repository root and makes it easy to open,
              preview, and review each page.
            </p>
          </div>

          <div class="stats-card">
            <div class="stat">
              <strong id="file-count">0</strong>
              <span>Pages</span>
            </div>
          </div>
        </section>

        <div class="toolbar">
          <label class="search" aria-label="Search pages">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="M21 21L16.65 16.65"></path>
            </svg>
            <input id="q" type="search" placeholder="Search page names..." />
          </label>
          <button id="refresh" type="button">Refresh list</button>
        </div>

        <ul id="list" class="list" aria-live="polite"></ul>
      </main>
    </div>

    <script>
      const owner = 'nourddinak';
      const repo = 'apps-privacy';
      const branch = 'main';
      const listEl = document.getElementById('list');
      const qEl = document.getElementById('q');
      const countEl = document.getElementById('file-count');

      function applyTheme(theme) {
        const root = document.documentElement;
        root.setAttribute('data-theme', theme);
        const toggle = document.getElementById('toggle-theme');
        toggle.textContent = theme === 'dark' ? 'Light mode' : 'Dark mode';
      }

      function restoreTheme() {
        const saved = localStorage.getItem('apps-privacy-theme');
        const preferred = saved || 'light';
        applyTheme(preferred);
      }

      async function fetchHtmlFiles() {
        listEl.innerHTML = '<li class="loading-state">Loading pages…</li>';

        try {
          const api = `https://api.github.com/repos/${owner}/${repo}/contents?ref=${branch}`;
          const res = await fetch(api);
          if (!res.ok) throw new Error(res.status + ' ' + res.statusText);

          const files = await res.json();
          const htmlFiles = files
            .filter(f => f.type === 'file' && f.name.toLowerCase().endsWith('.html'))
            .filter(f => f.name.toLowerCase() !== 'index.html')
            .sort((a, b) => a.name.localeCompare(b.name));

          renderList(htmlFiles);
        } catch (err) {
          listEl.innerHTML = `<li class="empty-state">Could not fetch repository contents: ${escapeHtml(err.message)}</li>`;
          countEl.textContent = '0';
        }
      }

      function renderList(files) {
        countEl.textContent = String(files.length || 0);

        if (!files || files.length === 0) {
          listEl.innerHTML = '<li class="empty-state">No HTML pages found in the repository root.</li>';
          return;
        }

        const q = (qEl.value || '').toLowerCase().trim();
        const visible = files.filter(file => file.name.toLowerCase().includes(q));

        if (visible.length === 0) {
          listEl.innerHTML = '<li class="empty-state">No pages match your search.</li>';
          return;
        }

        listEl.innerHTML = visible.map(file => {
          const href = './' + encodeURIComponent(file.name);
          const htmlUrl = file.html_url || '';
          const path = file.path || '';
          const size = Number(file.size || 0);
          const sizeText = size >= 1024 ? `${(size / 1024).toFixed(1)} KB` : `${size} bytes`;

          return `
            <li class="list-item">
              <div class="item-main">
                <span class="file-tag">HTML</span>
                <a class="file-name" href="${href}">${escapeHtml(file.name)}</a>
                <div class="meta-row">
                  <span>${escapeHtml(path)}</span>
                  <a href="${htmlUrl}" target="_blank" rel="noopener noreferrer">View on GitHub</a>
                </div>
              </div>
              <div class="size-pill">${sizeText}</div>
            </li>
          `;
        }).join('');
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[c]));
      }

      document.getElementById('refresh').addEventListener('click', fetchHtmlFiles);
      qEl.addEventListener('input', () => fetchHtmlFiles());

      document.getElementById('toggle-theme').addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
        const next = current === 'dark' ? 'light' : 'dark';
        localStorage.setItem('apps-privacy-theme', next);
        applyTheme(next);
      });

      restoreTheme();
      fetchHtmlFiles();
    </script>
  </body>
</html>
